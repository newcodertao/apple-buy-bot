<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>购买助手</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #16283c; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; padding: 22px; font-size: 14px; line-height: 1.6; }
    h1 { margin: 0; font-size: 21px; line-height: 1.3; }
    .intro { margin: 7px 0 18px; color: #465971; }
    #status { min-height: 66px; margin-bottom: 18px; padding: 12px; background: #e7edf6; border-radius: 9px; overflow-wrap: anywhere; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input { display: block; width: 100%; min-height: 42px; padding: 9px 10px; border: 1px solid #798ba2; border-radius: 6px; font: inherit; background: #fff; color: #16283c; }
    .field { margin-bottom: 15px; }
    .hint { display: block; margin-top: 5px; color: #465971; font-size: 12px; }
    button { cursor: pointer; min-height: 42px; padding: 10px 12px; border: 1px solid #7b8ca1; border-radius: 7px; font: inherit; font-weight: 600; background: #fff; color: #16283c; }
    button:hover { background: #e7edf6; }
    button:disabled { cursor: default; opacity: .55; }
    #connect { width: 100%; border-color: #1454b8; background: #1454b8; color: #fff; }
    #connect:hover:not(:disabled) { background: #0c439c; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .actions button { flex: 1; }
    :focus-visible { outline: 3px solid #f09a26; outline-offset: 2px; }
    .note { margin: 15px 0 0; font-size: 12px; color: #465971; }
    @media (prefers-color-scheme: dark) {
      :root { background: #172231; color: #f0f4fa; }
      .intro,.hint,.note { color: #c0cede; }
      #status { background: #28384d; }
      input,button { background: #202f43; color: #f0f4fa; border-color: #8497af; }
      button:hover { background: #35475e; }
      #connect { background: #2569c9; border-color: #75aaff; }
    }
  </style>
</head>
<body>
  <h1>连接当前购物标签页</h1>
  <p class="intro">淘宝 · 京东 · Apple 中国大陆</p>
  <div id="status" role="status" aria-live="polite" aria-atomic="true">正在读取连接状态…</div>
  <form id="pair-form">
    <div class="field">
      <label for="service">本机控制台</label>
      <input id="service" type="url" required value="http://127.0.0.1:8766" autocomplete="url" spellcheck="false">
    </div>
    <div class="field">
      <label for="token">配对码</label>
      <input id="token" type="password" required autocomplete="off" spellcheck="false" aria-describedby="token-hint">
      <small class="hint" id="token-hint">在本机控制台生成并粘贴；不会保存到磁盘。</small>
    </div>
    <button id="connect" type="submit">连接当前标签页</button>
  </form>
  <div class="actions">
    <button id="console" type="button">打开控制台</button>
    <button id="disconnect" type="button" disabled>断开连接</button>
  </div>
  <p class="note">先在购物网页正常登录。连接后会显示浏览器调试提示；开始、暂停和购买条件仍在本机控制台设置。这里只连接当前标签页，不会自动购买或付款。</p>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
