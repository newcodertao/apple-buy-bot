# Example preferences only; product names/colors/date are NOT confirmed sales information.
# Copy with `python -m src.main init`. Never save passwords, cookies or OTPs here.
app:
  dry_run: true
  headless: false
  browser: extension  # extension: selected normal Chrome/Edge tabs; chrome/msedge: legacy profiles.
sale:
  time: null  # Set confirmed local sale time, e.g. "2026-09-12 20:00:00"
  timezone: Asia/Shanghai
product:
  model_priority: ["iPhone 18 Pro Max", "iPhone 18 Pro"]
  capacity_priority: ["512GB", "256GB", "1TB"]
  color_priority: ["黑色", "银色", "冰川蓝色", "勃艮第酒红色"]
  quantity: 1
  max_price: 15000  # CNY per unit; full checkout total must also fit quantity * max_price.
  max_total: 15000  # Actual payable total, including approved shipping and fees.
products:
  iphone18promax:
    model: "iPhone 18 Pro Max"
    platforms:
      apple: {url: ""}  # UNKNOWN: fill only from the real official product page.
      # Use IDs and region exactly as verified on the live marketplace page.
      # Empty seller_ids/region allow inspection, but never checkout submission.
      jd: {url: "", seller_ids: [], region: "", max_shipping: 0, max_fees: 0}
      taobao: {url: "", seller_ids: [], region: "", max_shipping: 0, max_fees: 0}
  iphone18pro:
    model: "iPhone 18 Pro"
    platforms:
      apple: {url: ""}
      jd: {url: ""}
      taobao: {url: ""}
platforms:
  apple: {enabled: true}
  jd: {enabled: true, refresh_interval: 10}
  taobao: {enabled: true, refresh_interval: 10}
monitor:
  normal_interval: 3.0
  warmup_interval: 1.0
  sale_interval: 0.5
  jitter: 0.1
  max_retries: 5
  backoff_max: 30.0
  max_checks: 120
  sale_window_seconds: 60
order:
  mode: race
  auto_submit: false
  single_order_lock: true
  payment_method: installments
  installment_bank: 中国建设银行
  # Only applies when terms are UNKNOWN; known non-zero-cost offers always pause.
  allow_post_order_financing_check: false
