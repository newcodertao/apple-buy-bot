[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-buy-bot"
version = "0.1.0"
description = "Local Apple purchase assistance with explicit human takeover and safe dry runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
apple-buy-bot = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: local Chromium fixture integration test (no real commerce)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
